<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latent Journey - Experiment Results</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        .header h1 {
            margin: 0;
            font-size: 2.5em;
            font-weight: 300;
        }
        .header p {
            margin: 10px 0 0 0;
            opacity: 0.8;
            font-size: 1.1em;
        }
        .controls {
            padding: 20px;
            background: #f8f9fa;
            border-bottom: 1px solid #dee2e6;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s ease;
        }
        .btn-primary {
            background: #007bff;
            color: white;
        }
        .btn-primary:hover {
            background: #0056b3;
            transform: translateY(-2px);
        }
        .btn-success {
            background: #28a745;
            color: white;
        }
        .btn-success:hover {
            background: #1e7e34;
            transform: translateY(-2px);
        }
        .btn-info {
            background: #17a2b8;
            color: white;
        }
        .btn-info:hover {
            background: #138496;
            transform: translateY(-2px);
        }
        .content {
            padding: 30px;
        }
        .experiment-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .experiment-card {
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 20px;
            background: #f8f9fa;
            transition: all 0.3s ease;
        }
        .experiment-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .experiment-card h3 {
            margin: 0 0 10px 0;
            color: #2c3e50;
            font-size: 1.2em;
        }
        .experiment-card .status {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
            text-transform: uppercase;
        }
        .status.not-run {
            background: #e9ecef;
            color: #6c757d;
        }
        .status.running {
            background: #fff3cd;
            color: #856404;
        }
        .status.completed {
            background: #d4edda;
            color: #155724;
        }
        .status.failed {
            background: #f8d7da;
            color: #721c24;
        }
        .metrics {
            margin-top: 15px;
        }
        .metric {
            display: flex;
            justify-content: space-between;
            margin: 5px 0;
            padding: 5px 0;
            border-bottom: 1px solid #e9ecef;
        }
        .metric:last-child {
            border-bottom: none;
        }
        .metric-label {
            font-weight: 500;
            color: #495057;
        }
        .metric-value {
            font-family: 'Courier New', monospace;
            color: #007bff;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #6c757d;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 5px;
            margin: 20px 0;
        }
        .summary-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }
        .stat-card h3 {
            margin: 0 0 10px 0;
            font-size: 2em;
        }
        .stat-card p {
            margin: 0;
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔬 Latent Journey Experiments</h1>
            <p>AI Consciousness & Memory Research Platform</p>
        </div>
        
        <div class="controls">
            <button class="btn btn-primary" onclick="loadSummary()">📊 Summary</button>
            <button class="btn btn-success" onclick="loadResults()">📈 Results</button>
            <button class="btn btn-info" onclick="loadStatus()">⚡ Status</button>
            <button class="btn btn-success" onclick="runAllExperiments()">🚀 Run All</button>
        </div>
        
        <div class="content">
            <div id="content">
                <div class="loading">Loading experiment data...</div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8086/api/experiments';
        
        async function fetchData(endpoint) {
            try {
                const response = await fetch(`${API_BASE}${endpoint}`);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                return await response.json();
            } catch (error) {
                console.error('Error fetching data:', error);
                return { error: error.message };
            }
        }
        
        function showError(message) {
            document.getElementById('content').innerHTML = `
                <div class="error">
                    <strong>Error:</strong> ${message}
                </div>
            `;
        }
        
        function formatValue(value) {
            if (value === null || value === undefined) return 'N/A';
            if (typeof value === 'number') {
                return value.toFixed(3);
            }
            return value.toString();
        }
        
        function getStatusClass(status) {
            switch (status) {
                case 'completed': return 'completed';
                case 'running': return 'running';
                case 'failed': return 'failed';
                default: return 'not-run';
            }
        }
        
        async function loadSummary() {
            const data = await fetchData('/summary');
            if (data.error) {
                showError(data.error);
                return;
            }
            
            const summary = data.data;
            document.getElementById('content').innerHTML = `
                <div class="summary-stats">
                    <div class="stat-card">
                        <h3>${summary.total_experiments}</h3>
                        <p>Total Experiments</p>
                    </div>
                    <div class="stat-card">
                        <h3>${summary.completed}</h3>
                        <p>Completed</p>
                    </div>
                    <div class="stat-card">
                        <h3>${summary.failed}</h3>
                        <p>Failed</p>
                    </div>
                    <div class="stat-card">
                        <h3>${summary.running ? 'Yes' : 'No'}</h3>
                        <p>Currently Running</p>
                    </div>
                </div>
                
                <div class="experiment-grid">
                    ${summary.experiments.map(exp => `
                        <div class="experiment-card">
                            <h3>${exp.id}: ${exp.name}</h3>
                            <span class="status ${getStatusClass(exp.status)}">${exp.status}</span>
                            ${exp.last_metrics ? `
                                <div class="metrics">
                                    ${Object.entries(exp.last_metrics).map(([key, value]) => `
                                        <div class="metric">
                                            <span class="metric-label">${key.replace(/_/g, ' ')}</span>
                                            <span class="metric-value">${formatValue(value)}</span>
                                        </div>
                                    `).join('')}
                                </div>
                            ` : ''}
                        </div>
                    `).join('')}
                </div>
            `;
        }
        
        async function loadResults() {
            const data = await fetchData('/results');
            if (data.error) {
                showError(data.error);
                return;
            }
            
            const results = data.data;
            if (results.length === 0) {
                document.getElementById('content').innerHTML = `
                    <div class="loading">
                        No experiment results available. Run some experiments first!
                    </div>
                `;
                return;
            }
            
            document.getElementById('content').innerHTML = `
                <div class="experiment-grid">
                    ${results.map(result => `
                        <div class="experiment-card">
                            <h3>${result.experiment_id}</h3>
                            <span class="status ${result.success ? 'completed' : 'failed'}">
                                ${result.success ? 'Completed' : 'Failed'}
                            </span>
                            <div class="metrics">
                                <div class="metric">
                                    <span class="metric-label">Duration</span>
                                    <span class="metric-value">${result.duration_ms}ms</span>
                                </div>
                                <div class="metric">
                                    <span class="metric-label">Timestamp</span>
                                    <span class="metric-value">${new Date(result.timestamp).toLocaleString()}</span>
                                </div>
                                ${result.metrics ? Object.entries(result.metrics).map(([key, value]) => `
                                    <div class="metric">
                                        <span class="metric-label">${key.replace(/_/g, ' ')}</span>
                                        <span class="metric-value">${formatValue(value)}</span>
                                    </div>
                                `).join('') : ''}
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
        }
        
        async function loadStatus() {
            const data = await fetchData('/status');
            if (data.error) {
                showError(data.error);
                return;
            }
            
            const status = data.data;
            document.getElementById('content').innerHTML = `
                <div class="summary-stats">
                    <div class="stat-card">
                        <h3>${status.running ? 'Yes' : 'No'}</h3>
                        <p>Currently Running</p>
                    </div>
                    <div class="stat-card">
                        <h3>${status.progress.toFixed(1)}%</h3>
                        <p>Progress</p>
                    </div>
                    <div class="stat-card">
                        <h3>${status.completed_experiments.length}</h3>
                        <p>Completed</p>
                    </div>
                    <div class="stat-card">
                        <h3>${status.failed_experiments.length}</h3>
                        <p>Failed</p>
                    </div>
                </div>
                
                ${status.current_experiment ? `
                    <div class="experiment-card">
                        <h3>Current Experiment: ${status.current_experiment}</h3>
                        <div class="metric">
                            <span class="metric-label">Progress</span>
                            <span class="metric-value">${status.progress.toFixed(1)}%</span>
                        </div>
                    </div>
                ` : ''}
                
                ${status.completed_experiments.length > 0 ? `
                    <div class="experiment-card">
                        <h3>Completed Experiments</h3>
                        <p>${status.completed_experiments.join(', ')}</p>
                    </div>
                ` : ''}
                
                ${status.failed_experiments.length > 0 ? `
                    <div class="experiment-card">
                        <h3>Failed Experiments</h3>
                        <p>${status.failed_experiments.join(', ')}</p>
                    </div>
                ` : ''}
            `;
        }
        
        async function runAllExperiments() {
            document.getElementById('content').innerHTML = `
                <div class="loading">
                    🚀 Running all experiments... This may take several minutes.
                </div>
            `;
            
            try {
                const response = await fetch(`${API_BASE}/run-all`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const result = await response.json();
                document.getElementById('content').innerHTML = `
                    <div class="experiment-card">
                        <h3>✅ Experiments Started</h3>
                        <p>All experiments have been queued for execution. Check the status or results to see progress.</p>
                    </div>
                `;
            } catch (error) {
                showError(`Failed to start experiments: ${error.message}`);
            }
        }
        
        // Load summary on page load
        window.onload = loadSummary;
    </script>
</body>
</html>
