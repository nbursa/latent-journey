[package]
name = "experiments-rs"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", features = ["json"] }
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
warp = "0.3"
tracing = "0.1"
tracing-subscriber = "0.3"
serde_yaml = "0.9"
csv = "1.1"
fastrand = "2.3.0"
rand = "0.8.5"
rand_chacha = "0.3.1"
